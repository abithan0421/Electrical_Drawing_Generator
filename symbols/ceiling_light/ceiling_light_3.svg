<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">
  <!-- Ceiling line -->
  <line x1="0" y1="10" x2="100" y2="10" stroke="black" stroke-width="2" />
  <!-- Hanging line -->
  <line x1="50" y1="10" x2="50" y2="60" stroke="black" stroke-width="2" />
  <!-- Lamp circle -->
  <circle cx="50" cy="80" r="20" stroke="black" stroke-width="2" fill="none" />
</svg>
