<svg xmlns="http://www.w3.org/2000/svg" width="140" height="120" viewBox="0 0 140 120">
  <!-- Outer rectangle -->
  <rect x="20" y="30" width="100" height="60" stroke="black" stroke-width="2" fill="none" />
  <!-- Circle inside to represent heavy socket -->
  <circle cx="70" cy="60" r="15" stroke="black" stroke-width="2" fill="none" />
  <!-- Label -->
  <text x="70" y="100" font-size="16" text-anchor="middle" fill="black">Cooker</text>
</svg>
